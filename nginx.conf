server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # MIME pour .geojson (sinon servi en octet-stream → pas de gzip, pas de cache Cloudflare)
    # NB: la directive types REMPLACE la table par défaut du http block → lister TOUS les
    # types nécessaires ici (html/js/css/svg/json/ico + geo+json). Ne PAS faire
    # `include /etc/nginx/mime.types` dans types {} (invalide : le fichier contient un bloc complet).
    types {
        text/html html htm;
        text/css css;
        text/plain txt;
        application/javascript js mjs;
        application/json json map;
        application/geo+json geojson;
        image/svg+xml svg svgz;
        image/x-icon ico;
        image/png png;
        image/webp webp;
        font/woff2 woff2;
        application/octet-stream bin;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback : toutes les routes → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets avec hash
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache pour le GeoJSON des frontières
    location /countries.geojson {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Cache pour les séries temporelles
    location /series.json {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
    gzip_min_length 256;
}
